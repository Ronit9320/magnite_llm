name: Publish preview release
# The only publisher. It builds and tests all three platforms from one commit on a
# release/** branch, then publishes them as one GitHub prerelease with signed update
# metadata for every platform. Two ways to start it:
#  - push a version tag (vX.Y-preview…) on a commit of a release branch: always stops
#    at a draft, which you publish on GitHub after checking it;
#  - run it by hand on a release branch (needs this file on the default branch).
# Branch pushes never publish. See docs/development/RELEASE_PIPELINE.md.
on:
  push:
    tags: ['v*-preview*']
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Type the RELEASE_VERSION from backend/src/backend/_version.py (for example v0.2-preview) to publish it'
        required: true
        type: string
      draft_only:
        description: 'Stop at a draft release (inspect it, then publish it on GitHub)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      name: ${{ steps.identity.outputs.name }}
    steps:
      - name: Only release branches and version tags publish
        if: ${{ !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this workflow on a release/** branch or push a version tag, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A version tag must sit on a release branch
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          if ! git branch -r --contains HEAD | grep -q 'origin/release/'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on any release/** branch."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Read and confirm the canonical identity
        id: identity
        env:
          # A tag push confirms the version by its name; a manual run by the typed input.
          CONFIRM: ${{ github.event_name == 'push' && github.ref_name || inputs.confirm_version }}
        run: |
          test -z "$(git status --porcelain)"
          version="$(python3 packaging/release_metadata.py --print-version)"
          name="$(python3 -c "import runpy; v = runpy.run_path('backend/src/backend/_version.py'); print(v.get('RELEASE_NAME') or 'Magnite Space ' + v['RELEASE_VERSION'])")"
          if test "$CONFIRM" != "$version"; then
            echo "::error::'$CONFIRM' (tag or confirm_version) does not match RELEASE_VERSION '$version'."
            exit 1
          fi
          # The notes become the release description; refuse stale ones.
          if ! head -n 1 docs/release/RELEASE_NOTES.md | grep -qF "$version"; then
            echo "::error::docs/release/RELEASE_NOTES.md must start with a heading that names $version."
            exit 1
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse a reused version or update sequence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          # gh exits non-zero both for a missing release and for API failures; tell them apart.
          if gh release view "$RELEASE_VERSION" --json tagName > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            echo "::error::Release $RELEASE_VERSION already exists. Published versions are never replaced; bump RELEASE_VERSION and UPDATE_SEQUENCE."
            exit 1
          elif ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::Could not confirm that $RELEASE_VERSION is unused."
            exit 1
          fi
          # A manual run creates the tag itself; a tag push has already created it here.
          if test "$GITHUB_EVENT_NAME" != push \
              && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" > /dev/null; then
            echo "::error::Tag $RELEASE_VERSION exists without a release. Inspect it before publishing."
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 packaging/check_release_sequence.py "$RUNNER_TEMP/releases.json"

  linux:
    needs: guard
    uses: ./.github/workflows/build-linux.yml
    with:
      source_sha: ${{ needs.guard.outputs.sha }}
  macos:
    needs: guard
    uses: ./.github/workflows/build-macos.yml
    with:
      source_sha: ${{ needs.guard.outputs.sha }}
  windows:
    needs: guard
    uses: ./.github/workflows/build-windows.yml
    with:
      source_sha: ${{ needs.guard.outputs.sha }}

  publish:
    needs: [guard, linux, macos, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Only this job can write releases or read the signing key.
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      # The exact tested packages, by name (evidence artifacts are left out).
      - uses: actions/download-artifact@v4
        with:
          name: linux-preview-${{ needs.guard.outputs.version }}
          path: collected/linux
      - uses: actions/download-artifact@v4
        with:
          name: macos-preview-${{ needs.guard.outputs.sha }}
          path: collected/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-${{ needs.guard.outputs.sha }}
          path: collected/windows
      - name: Verify the complete tested set
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.sha }}
        run: python3 packaging/verify_artifact_set.py --source-sha "$SOURCE_SHA" collected
      - name: Gather release assets
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir dist
          for name in "Magnite-$RELEASE_VERSION-linux-x86_64.AppImage" linux-compatibility.json TESTING.md \
                      "Magnite-$RELEASE_VERSION-arm64.dmg" "Magnite-$RELEASE_VERSION-macos-arm64.zip" \
                      "Magnite-$RELEASE_VERSION-windows-x86_64-setup.exe"; do
            found="$(find collected -type f -name "$name")"
            test "$(printf '%s\n' "$found" | grep -c .)" = 1 || { echo "::error::Expected exactly one $name"; exit 1; }
            cp "$found" dist/
          done
          ls -l dist
      - name: Sign update metadata for every platform
        env:
          MAGNITE_UPDATE_SIGNING_KEY: ${{ secrets.MAGNITE_UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          SOURCE_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          if test -z "$MAGNITE_UPDATE_SIGNING_KEY"; then
            echo '::error::Add the MAGNITE_UPDATE_SIGNING_KEY secret. See docs/development/RELEASE_PIPELINE.md.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/magnite-update-signing.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$MAGNITE_UPDATE_SIGNING_KEY" > "$key_file"
          sign() { python3 packaging/release_metadata.py --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA" --key "$key_file" "$@"; }
          sign --platform linux --package "dist/Magnite-$RELEASE_VERSION-linux-x86_64.AppImage"
          sign --platform macos --package "dist/Magnite-$RELEASE_VERSION-macos-arm64.zip"
          sign --platform windows --package "dist/Magnite-$RELEASE_VERSION-windows-x86_64-setup.exe"
          (cd dist && sha256sum Magnite-* update-*.json linux-compatibility.json > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create the draft release at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          RELEASE_NAME: ${{ needs.guard.outputs.name }}
          SOURCE_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          gh release create "$RELEASE_VERSION" --target "$SOURCE_SHA" --title "$RELEASE_NAME" \
            --draft --prerelease --latest=false --notes-file docs/release/RELEASE_NOTES.md
          gh release upload "$RELEASE_VERSION" dist/*
          gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/uploaded"
          (cd dist && ls -1 | sort) > "$RUNNER_TEMP/expected"
          diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/uploaded"
      - name: Publish the prerelease
        # Tag pushes always stop at a draft.
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.draft_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: gh release edit "$RELEASE_VERSION" --draft=false --prerelease --latest=false
      - name: Summary
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          DRAFT_ONLY: ${{ github.event_name == 'push' || inputs.draft_only }}
        run: |
          {
            echo "### $RELEASE_VERSION"
            if test "$DRAFT_ONLY" = true; then echo "Draft created. Review it on GitHub, then publish it as a prerelease."; else echo "Published as a prerelease (not marked latest)."; fi
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
