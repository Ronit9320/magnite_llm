name: Linux preview release

on:
  push:
    branches: [dev, 'release/**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/build-linux.yml
    with:
      source_sha: ${{ github.sha }}

  publish:
    # Integration/release branches build artifacts only. The coordinated
    # multi-platform publisher will replace this dev-only path later.
    if: github.ref == 'refs/heads/dev'
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-preview-${{ needs.package.outputs.version }}
          path: dist
      - name: Refuse overwrites of an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if test "$(cat "$RUNNER_TEMP/release-draft")" = false; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo 'This preview already exists. Package checks passed; bump RELEASE_VERSION and UPDATE_SEQUENCE to distribute another update.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'A draft with this version already exists. Inspect it and remove/recover the unfinished draft before retrying.' >&2
              exit 1
            fi
          elif git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo 'A tag already exists without a release. Inspect it before publishing.' >&2
            exit 1
          fi
      - name: Sign metadata with the persistent release key
        if: steps.existing.outputs.published != 'true'
        env:
          MAGNITE_UPDATE_SIGNING_KEY: ${{ secrets.MAGNITE_UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          if test -z "$MAGNITE_UPDATE_SIGNING_KEY"; then
            echo 'Add the MAGNITE_UPDATE_SIGNING_KEY repository secret. See docs/development/RELEASE_PIPELINE.md.' >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/magnite-update-signing.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$MAGNITE_UPDATE_SIGNING_KEY" > "$key_file"
          python3 packaging/release_metadata.py --repository "$GITHUB_REPOSITORY" \
            --appimage "dist/Magnite-$RELEASE_VERSION-linux-x86_64.AppImage" --key "$key_file"
      - name: Publish the verified preview, without marking it stable/latest
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Magnite $RELEASE_VERSION" \
            --draft --prerelease --latest=false --notes-file docs/release/RELEASE_NOTES.md
          gh release upload "$RELEASE_VERSION" \
            "dist/Magnite-$RELEASE_VERSION-linux-x86_64.AppImage" dist/SHA256SUMS \
            dist/update-linux-x86_64.json dist/update-linux-x86_64.json.sig \
            dist/linux-compatibility.json dist/TESTING.md
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease --latest=false
