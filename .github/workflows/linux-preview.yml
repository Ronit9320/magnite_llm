name: Linux preview package

# Manual Linux-only package build for quick checks. It never publishes: every
# release goes through release.yml on a release/** branch with all three platforms.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/'))
    uses: ./.github/workflows/build-linux.yml
    with:
      source_sha: ${{ github.sha }}
