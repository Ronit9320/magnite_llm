name: Verify local app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      MAGNITE_HOME: ${{ runner.temp }}/magnite-data
      XDG_CONFIG_HOME: ${{ runner.temp }}/magnite-config
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build qt6-base-dev libqt6svg6-dev libgl1-mesa-dev
      - name: Install base backend in desktop discovery layout
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e backend
      - name: Offline backend regressions
        env:
          PYTHONPATH: backend/src
        run: .venv/bin/python -m unittest discover -s backend/tests -v
      - name: Build client
        run: |
          cmake -S app -B build -G Ninja
          cmake --build build -j2
      - name: Theme audit
        run: ./build/magnite-app --theme-check
      - name: UI interaction and layout checks
        run: ./build/magnite-app --ui-check
      - name: Desktop and IPC selftest
        run: ./build/magnite-app --selftest
