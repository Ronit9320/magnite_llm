name: Verify local app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_OFFLINE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Configure isolated test storage
        run: |
          echo "MAGNITE_HOME=$RUNNER_TEMP/magnite-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/magnite-config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libssl-dev qt6-base-dev libqt6svg6-dev libgl1-mesa-dev
      - name: Install base backend in desktop discovery layout
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e backend
      - name: Offline backend regressions
        env:
          PYTHONPATH: backend/src
        run: .venv/bin/python -m unittest discover -s backend/tests -v
      - name: Build client
        run: |
          cmake -S app -B build -G Ninja
          cmake --build build -j2
      - name: Theme audit
        run: ./build/magnite-app --theme-check
      - name: Update verification and installer recovery
        run: |
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s packaging/tests -v
      - name: UI interaction and layout checks
        run: ./build/magnite-app --ui-check
      - name: Desktop and IPC selftest
        run: ./build/magnite-app --selftest
